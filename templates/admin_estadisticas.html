.section-title{font-size:21px;margin:30px 0 8px;letter-spacing:-.025em}.section-intro{color:var(--muted);margin:0 0 16px}.toc{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 24px}.toc a{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700}.toc a:hover{background:#eeecff;color:var(--brand)}.cm{width:100%;border-collapse:separate;border-spacing:5px;table-layout:fixed}.cm th{font-size:12px;color:var(--muted);padding:9px 5px}.cm td{padding:14px 5px;text-align:center;border-radius:10px;font-weight:800;font-size:19px}.cm td small{display:block;font-size:11px;font-weight:500;margin-top:5px}.cm .good{background:#d8f3e7;color:#12664a}.cm .bad{background:#fff0e6;color:#995026}.cm .total{background:#f1f3fa;color:var(--ink);font-size:14px}.cm .labelcell{text-align:left;background:#f6f7fc;font-size:13px;padding-left:12px}.metric-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.metric-kpis>div{padding:16px;background:#f6f7fd;border:1px solid var(--line);border-radius:12px}.metric-kpis strong{font-size:24px;display:block}.metric-kpis span{font-size:12px;color:var(--muted)}.note{padding:13px 16px;border-radius:11px;background:#f4f2ff;color:#4c4095;font-size:12px;line-height:1.6}.matrix-scroll{overflow-x:auto}.matrix-scroll .cm{min-width:560px}@media(max-width:650px){.metric-kpis{grid-template-columns:1fr}}main{max-width:1280px;margin:auto;padding:30px 24px 60px}h1{font-size:29px;margin:0;letter-spacing:-.04em}p.lead{color:var(--muted);margin:7px 0 24px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 10px 35px #27375b0a}.card{padding:22px}.card strong{font-size:29px;display:block}.card span{font-size:12px;color:var(--muted)}.panel{padding:22px;margin-bottom:18px}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:0 0 12px}.hint{color:v <header><div class="bar"><div class="logo"><span class="mark">♡</span><div>PQRS Salud<small>Panel de administración</small></div></div><nav><a href="/admin">Solicitudes</a><a class="on" href="/admin/estadisticas">Estadísticas</a><a href="/carga">Datos y modelo</a></nav><a class="salir" href="/admin/salir">Salir</a></div></header>
<main><div class="head"><div><h1>Estadísticas del sistema</h1><p class="lead">Análisis descriptivo del dataset y patrones frecuentes en las PQRS.</p></div><button class="btn" id="actualizar">Actualizar datos</button></div><nav class="toc"><a href="#resumen">Resumen</a><a href="#dataset">Dataset y NLP</a><a href="#solicitudes">Solicitudes</a><a href="#evaluacion">Evaluación y matriz</a></nav><div id="contenido" class="loading">Calculando estadísticas…</div></main>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('es-CO');
const dec=n=>n==null?'—':Number(n).toLocaleString('es-CO',{maximumFractionDigits:2});
function e(tag,attrs={},...children){const x=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='className')x.className=v;else if(k==='text')x.textContent=v;else x.setAttribute(k,v)}for(const c of children.flat()){if(c!==null&&c!==undefined)x.append(c instanceof Node?c:document.createTextNode(String(c)))}return x}
function panel(titulo,descripcion,contenido){return e('section',{className:'panel'},e('h2',{text:titulo}),e('p',{className:'hint',text:descripcion}),contenido)}
function barras(datos,limite=12){const box=e('div',{className:'bars'});if(!datos?.length)return e('p',{className:'hint',text:'No hay datos disponibles.'});const max=Math.max(1,...datos.map(x=>x.cantidad));const total=datos.reduce((a,x)=>a+Number(x.cantidad||0),0);for(const x of datos.slice(0,limite)){box.append(e('div',{className:'item'},e('div',{className:'name',text:x.nombre}),e('div',{className:'track'},e('div',{className:'fill',style:`width:${Math.max(0,x.cantidad/max*100)}%`})),e('div',{className:'num',text:fmt(x.cantidad)+' · '+(total?dec(x.cantidad/total*100):'0')+' %'})))}return box}
function tablaNumerica(items){const t=e('table',{className:'metrics'});t.append(e('thead',{},e('tr',{},e('th',{text:'Medida'}),...items.map(x=>e('th',{text:x[0]})))));const nombres=[['n','Observaciones'],['media','Media'],['mediana','Mediana'],['moda','Moda'],['desviacion','Desviación típica (poblacional)'],['minimo','Mínimo'],['q1','Cuartil 1 (25 %)'],['q3','Cuartil 3 (75 %)'],['maximo','Máximo']];const body=e('tbody');for(const [clave,nombre] of nombres)body.append(e('tr',{},e('td',{text:nombre}),...items.map(x=>e('td',{text:dec(x[1][clave])}))));t.append(body);return e('div',{className:'filetable'},t)}
function distribucion(titulo,descripcion,estadistica){return panel(titulo,descripcion,barras(estadistica?.histograma||[],20))}
function kpis(items){return e('div',{className:'kpis'},...items.map(([valor,nombre])=>e('div',{className:'card'},e('strong',{text:fmt(valor)}),e('span',{text:nombre}))))}
function tablaArchivos(archivos){const t=e('table',{className:'metrics'});t.append(e('thead',{},e('tr',{},...['Archivo CSV','Registros','Columna de texto','Etiqueta'].map(x=>e('th',{text:x})))));const body=e('tbody');for(const a of archivos)body.append(e('tr',{},e('td',{text:a.archivo}),e('td',{text:fmt(a.registros)}),e('td',{text:a.columna_texto||'No detectada'}),e('td',{text:a.columna_etiqueta||'No detectada'})));t.append(body);return e('div',{className:'filetable'},t)}
function tituloSeccion(id,titulo,descripcion){return e('div',{id},e('h2',{className:'section-title',text:titulo}),e('p',{className:'section-intro',text:descripcion}))}
function matrizEvaluacion(m){
 const seccion=e('section',{id:'evaluacion',className:'panel'},e('h2',{text:'4. Evaluación del modelo y matriz de confusión'}),e('p',{className:'hint',text:'Resultados de la última evaluación guardada. Se actualizan al completar un nuevo reentrenamiento y actualizar esta página.'}));
 if(!m || !Array.isArray(m.matriz_confusion) || !Array.isArray(m.orden_clases_matriz)){seccion.append(e('div',{className:'note',text:'No hay una matriz de confusión disponible. Ejecuta un reentrenamiento desde Datos y modelo para generarla.'}));return seccion}
 const clases=m.orden_clases_matriz,mat=m.matriz_confusion;
 if(mat.length!==clases.length||mat.some(f=>!Array.isArray(f)||f.length!==clases.length)){seccion.append(e('p',{className:'error',text:'La matriz guardada no coincide con las clases.'}));return seccion}
 const total=mat.flat().reduce((a,b)=>a+Number(b||0),0),correctos=mat.reduce((a,f,i)=>a+Number(f[i]||0),0);
 const metrics=e('div',{className:'metric-kpis'},...[[m.f1_macro==null?'—':dec(m.f1_macro),'F1 macro de prueba'],[total?dec(correctos/total*100)+' %':'—','Exactitud en prueba'],[fmt(total),'Casos evaluados']].map(([v,l])=>e('div',{},e('strong',{text:v}),e('span',{text:l}))));seccion.append(metrics);
 const tabla=e('table',{className:'cm'}),head=e('tr',{},e('th',{text:'Real / Predicción'}),...clases.map(c=>e('th',{text:c})),e('th',{text:'Total real'}));tabla.append(e('thead',{},head));const body=e('tbody');
 mat.forEach((fila,i)=>{const suma=fila.reduce((a,b)=>a+Number(b||0),0);body.append(e('tr',{},e('td',{className:'labelcell',text:clases[i]}),...fila.map((v,j)=>e('td',{className:i===j?'good':'bad'},e('span',{text:fmt(v)}),e('small',{text:suma?dec(v/suma*100)+' % de la fila':'—'}))),e('td',{className:'total',text:fmt(suma)})))});
 body.append(e('tr',{},e('td',{className:'labelcell',text:'Total predicho'}),...clases.map((_,j)=>e('td',{className:'total',text:fmt(mat.reduce((a,f)=>a+Number(f[j]||0),0))})),e('td',{className:'total',text:fmt(total)})));tabla.append(body);seccion.append(e('div',{className:'matrix-scroll'},tabla));
 seccion.append(e('p',{className:'hint',text:'Filas = etiqueta verdadera; columnas = predicción. Verde = aciertos; naranja = errores. El porcentaje de cada celda corresponde a su fila.'}));
 const tablaClase=e('table',{className:'metrics'});tablaClase.append(e('thead',{},e('tr',{},...['Clase','Precisión','Recall','F1-score','Casos reales'].map(x=>e('th',{text:x})))));const tb=e('tbody');
 clases.forEach((c,i)=>{const fila=mat[i].reduce((a,b)=>a+Number(b||0),0),col=mat.reduce((a,f)=>a+Number(f[i]||0),0),tp=Number(mat[i][i]||0),prec=col?tp/col:0,rec=fila?tp/fila:0,f1=prec+rec?2*prec*rec/(prec+rec):0;tb.append(e('tr',{},... [c,dec(prec*100)+' %',dec(rec*100)+' %',dec(f1*100)+' %',fmt(fila)].map(x=>e('td',{text:x}))))});tablaClase.append(tb);seccion.append(e('h3',{text:'Rendimiento por clase'}),e('div',{className:'filetable'},tablaClase));
 const fecha=m.fecha?' · Fecha: '+m.fecha:'';seccion.append(e('div',{className:'note',text:'Fuente: '+(m.archivo_origen||'evaluación almacenada')+fecha+'. Esta matriz corresponde a un modelo candidato evaluado sobre datos de prueba; no demuestra por sí sola el desempeño del modelo publicado. Para actualizarla, realiza una nueva evaluación desde Datos y modelo.'}));return seccion
}
function dibujar(r){const d=r.dataset,p=r.pqrs,box=$('contenido');box.className='';box.replaceChildren();
box.append(tituloSeccion('resumen','1. Resumen general','Vista rápida de registros, solicitudes y resultados disponibles'),kpis([[d.total_registros,'Filas en archivos CSV'],[p.total,'PQRS registradas'],[p.pqrs_corregidas,'PQRS corregidas'],[d.patrones.palabras_distintas,'Palabras distintas en dataset']]));
box.append(tituloSeccion('dataset','2. Dataset y patrones NLP','Exploración de archivos CSV, distribución y lenguaje frecuente'));
box.append(e('h2',{text:'Dataset de entrenamiento / carga'}),e('p',{className:'hint',text:'Cuenta filas de archivos CSV ubicados directamente en la carpeta configurada. Si un registro aparece en varios archivos, se contará varias veces; no equivale necesariamente al tamaño del conjunto único de entrenamiento.'}),kpis([[d.total_registros,'Registros en archivos CSV'],[d.archivos.length,'Archivos CSV encontrados'],[d.textos_analizados,'Textos CSV analizados'],[d.patrones.palabras_distintas,'Palabras distintas en CSV']]));
for(const aviso of d.advertencias||[])box.append(e('p',{className:'error',text:aviso}));
box.append(panel('Archivos detectados',`Directorio: ${d.directorio}`,tablaArchivos(d.archivos)),panel('Estadística descriptiva del dataset','Longitud de los textos CSV medida en palabras.',tablaNumerica([['Palabras por texto',d.longitud_palabras]])),distribucion('Histograma de longitud del dataset','Número de textos por intervalo de palabras.',d.longitud_palabras),e('div',{className:'two'},panel('Palabras frecuentes en CSV','Frecuencia total de aparición, sin palabras vacías comunes.',barras(d.patrones.palabras)),panel('Frases frecuentes en CSV','Pares de palabras consecutivas después de filtrar palabras vacías.',barras(d.patrones.frases))));
box.append(e('div',{className:'two'},panel('Etiquetas de urgencia en CSV','Distribución de etiquetas cuando existe una columna reconocida.',barras(d.etiquetas)),panel('Tipos de PQRS en CSV','Categorías cuando existe columna tipo en el dataset.',barras(d.tipos))));
box.append(tituloSeccion('solicitudes','3. Solicitudes registradas','Análisis de la base SQLite, distinto de los archivos del dataset'));
box.append(e('h2',{text:'Solicitudes PQRS registradas'}),e('p',{className:'hint',text:'Estas métricas se calculan desde SQLite y son independientes de los archivos CSV.'}),kpis([[p.total,'PQRS registradas'],[p.pqrs_corregidas,'PQRS con revisión humana'],[p.correcciones_eventos,'Cambios de riesgo registrados'],[p.patrones.palabras_distintas,'Palabras distintas en PQRS']]));
box.append(panel('Estadística descriptiva de PQRS','Desviación típica poblacional; confianza expresada en porcentaje y longitud de las solicitudes.',tablaNumerica([['Confianza (%)',p.confianza_porcentaje],['Palabras',p.longitud_palabras],['Caracteres',p.longitud_caracteres]])),e('div',{className:'two'},distribucion('Histograma de confianza','Confianza de la predicción de urgencia; no equivale a exactitud.',p.confianza_porcentaje),distribucion('Histograma de longitud','Palabras por PQRS registrada.',p.longitud_palabras)),e('div',{className:'two'},panel('Clasificación final del riesgo','Incluye correcciones administrativas.',barras(p.riesgo_final)),panel('Estados de las PQRS','Frecuencias absolutas.',barras(p.estados))),e('div',{className:'two'},panel('Entidades con más solicitudes','Hasta 12 entidades.',barras(p.entidades)),panel('Temas frecuentes','Hasta 12 temas.',barras(p.temas))),panel('Tipos de PQRS','Categoría registrada en el formulario; no es una predicción automática.',barras(p.tipos)),e('div',{className:'two'},panel('Palabras frecuentes en PQRS','Conteo de palabras tras normalizar y filtrar términos comunes.',barras(p.patrones.palabras)),panel('Frases frecuentes en PQRS','Conteo de pares de palabras normalizadas.',barras(p.patrones.frases))),e('div',{className:'two'},panel('Solicitudes por mes','Evolución de radicaciones.',barras(p.meses,24)),panel('Clasificación original del modelo','Antes de correcciones humanas.',barras(p.riesgo_original))));
box.append(matrizEvaluacion(r.evaluacion));
box.append(e('p',{className:'hint',text:'Nota: los porcentajes de barras se calculan respecto a los valores mostrados (si se limita a 12, no representan necesariamente el total). Las palabras y frases frecuentes son patrones léxicos descriptivos; no equivalen a patrones aprendidos internamente por el modelo ni a clases latentes. La moda numérica se muestra solo si algún valor se repite.'}));}
async function cargar(){const b=$('actualizar');b.disabled=true;try{const r=await fetch('/api/admin/estadisticas',{credentials:'same-origin'});if(r.status===401){location.href='/admin/login';return}if(!r.ok)throw Error('El servidor devolvió '+r.status);dibujar(await r.json())}catch(err){$('contenido').className='error';$('contenido').textContent='No se pudieron calcular las estadísticas: '+err.message}finally{b.disabled=false}}
$('actualizar').onclick=cargar;cargar();
</script></body></html>
