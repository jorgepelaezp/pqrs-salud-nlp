<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas · PQRS Salud</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--ink:#17233c;--muted:#718099;--line:#e2e8f3;--brand:#5546e8;--bg:#f5f7fd}
*{box-sizing:border-box}body{margin:0;font:14px 'DM Sans','Segoe UI',sans-serif;color:var(--ink);background:radial-gradient(circle at 0 0,#efedff,transparent 35%),var(--bg)}
header{background:#ffffffed;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.bar{max-width:1280px;margin:auto;padding:15px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.logo{font-size:17px;font-weight:800;display:flex;align-items:center;gap:11px}.mark{background:linear-gradient(135deg,#5546e8,#873ced);color:white;border-radius:12px;width:39px;height:39px;display:grid;place-items:center;font-size:22px}.logo small{display:block;font-size:12px;color:var(--muted);font-weight:500}nav{display:flex;gap:5px;flex:1}nav a{padding:10px 14px;text-decoration:none;color:var(--muted);border-radius:10px;font-weight:600}nav a.on,nav a:hover{background:#eeecff;color:var(--brand)}.salir{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:10px}
main{max-width:1280px;margin:auto;padding:30px 24px 60px}h1{font-size:29px;margin:0;letter-spacing:-.04em}p.lead{color:var(--muted);margin:7px 0 24px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 10px 35px #27375b0a}.card{padding:22px}.card strong{font-size:29px;display:block}.card span{font-size:12px;color:var(--muted)}.panel{padding:22px;margin-bottom:18px}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:0 0 12px}.hint{color:var(--muted);font-size:12px;line-height:1.6}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.bars{display:grid;gap:11px}.item{display:grid;grid-template-columns:minmax(110px,1fr) 3fr 52px;gap:12px;align-items:center}.name{font-size:12px;overflow-wrap:anywhere}.track{height:12px;border-radius:99px;background:#edf0fa;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#5546e8,#9b7aed)}.num{text-align:right;font-size:12px;font-weight:800}.metrics{width:100%;border-collapse:collapse}.metrics th,.metrics td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.metrics th{color:var(--muted);font-weight:600}.metrics td:not(:first-child){text-align:right}.pill{display:inline-block;background:#eeecff;color:#5546e8;border-radius:99px;padding:6px 10px;font-size:12px;margin:3px}.error{background:#fee2e2;color:#991b1b;border-radius:9px;padding:12px;margin:12px 0}.filetable{overflow:auto}.btn{background:#5546e8;color:white;border:0;border-radius:10px;padding:11px 17px;font:inherit;font-weight:700;cursor:pointer}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.loading{padding:40px;text-align:center;color:var(--muted)}@media(max-width:950px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:600px){main{padding:22px 13px}.bar{padding:12px}nav{order:3;flex-basis:100%}.kpis{grid-template-columns:1fr}.item{grid-template-columns:minmax(75px,1fr) 2fr 35px;gap:7px}.panel{padding:16px}}
</style></head><body>
<header><div class="bar"><div class="logo"><span class="mark">♡</span><div>PQRS Salud<small>Panel de administración</small></div></div><nav><a href="/admin">Solicitudes</a><a class="on" href="/admin/estadisticas">Estadísticas</a><a href="/carga">Datos y modelo</a></nav><a class="salir" href="/admin/salir">Salir</a></div></header>
<main><div class="head"><div><h1>Estadísticas del sistema</h1><p class="lead">Análisis descriptivo del dataset y patrones frecuentes en las PQRS.</p></div><button class="btn" id="actualizar">Actualizar datos</button></div><div id="contenido" class="loading">Calculando estadísticas…</div></main>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('es-CO');
const dec=n=>n==null?'—':Number(n).toLocaleString('es-CO',{maximumFractionDigits:2});
function e(tag,attrs={},...children){const x=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='className')x.className=v;else if(k==='text')x.textContent=v;else x.setAttribute(k,v)}for(const c of children.flat()){if(c!==null&&c!==undefined)x.append(c instanceof Node?c:document.createTextNode(String(c)))}return x}
function panel(titulo,descripcion,contenido){return e('section',{className:'panel'},e('h2',{text:titulo}),e('p',{className:'hint',text:descripcion}),contenido)}
function barras(datos,limite=12){const box=e('div',{className:'bars'});if(!datos?.length)return e('p',{className:'hint',text:'No hay datos disponibles.'});const max=Math.max(1,...datos.map(x=>x.cantidad));for(const x of datos.slice(0,limite)){box.append(e('div',{className:'item'},e('div',{className:'name',text:x.nombre}),e('div',{className:'track'},e('div',{className:'fill',style:`width:${Math.max(0,x.cantidad/max*100)}%`})),e('div',{className:'num',text:fmt(x.cantidad)})))}return box}
function tablaNumerica(items){const t=e('table',{className:'metrics'});t.append(e('thead',{},e('tr',{},e('th',{text:'Medida'}),...items.map(x=>e('th',{text:x[0]})))));const nombres=[['n','Observaciones'],['media','Media'],['mediana','Mediana'],['moda','Moda'],['desviacion','Desviación típica (poblacional)'],['minimo','Mínimo'],['q1','Cuartil 1 (25 %)'],['q3','Cuartil 3 (75 %)'],['maximo','Máximo']];const body=e('tbody');for(const [clave,nombre] of nombres)body.append(e('tr',{},e('td',{text:nombre}),...items.map(x=>e('td',{text:dec(x[1][clave])}))));t.append(body);return e('div',{className:'filetable'},t)}
function kpis(items){return e('div',{className:'kpis'},...items.map(([valor,nombre])=>e('div',{className:'card'},e('strong',{text:fmt(valor)}),e('span',{text:nombre}))))}
function tablaArchivos(archivos){const t=e('table',{className:'metrics'});t.append(e('thead',{},e('tr',{},...['Archivo CSV','Registros','Columna de texto','Etiqueta'].map(x=>e('th',{text:x})))));const body=e('tbody');for(const a of archivos)body.append(e('tr',{},e('td',{text:a.archivo}),e('td',{text:fmt(a.registros)}),e('td',{text:a.columna_texto||'No detectada'}),e('td',{text:a.columna_etiqueta||'No detectada'})));t.append(body);return e('div',{className:'filetable'},t)}
function dibujar(r){const d=r.dataset,p=r.pqrs,box=$('contenido');box.className='';box.replaceChildren();
box.append(e('h2',{text:'1. Dataset de entrenamiento / carga'}),e('p',{className:'hint',text:'Cuenta filas de archivos CSV ubicados directamente en la carpeta configurada. Si un registro aparece en varios archivos, se contará varias veces; no equivale necesariamente al tamaño del conjunto único de entrenamiento.'}),kpis([[d.total_registros,'Registros en archivos CSV'],[d.archivos.length,'Archivos CSV encontrados'],[d.textos_analizados,'Textos CSV analizados'],[d.patrones.palabras_distintas,'Palabras distintas en CSV']]));
for(const aviso of d.advertencias||[])box.append(e('p',{className:'error',text:aviso}));
box.append(panel('Archivos detectados',`Directorio: ${d.directorio}`,tablaArchivos(d.archivos)),panel('Estadística descriptiva del dataset','Longitud de los textos CSV medida en palabras.',tablaNumerica([['Palabras por texto',d.longitud_palabras]])),e('div',{className:'two'},panel('Palabras frecuentes en CSV','Frecuencia total de aparición, sin palabras vacías comunes.',barras(d.patrones.palabras)),panel('Frases frecuentes en CSV','Pares de palabras consecutivas después de filtrar palabras vacías.',barras(d.patrones.frases))));
box.append(e('h2',{text:'2. Solicitudes PQRS registradas'}),e('p',{className:'hint',text:'Estas métricas se calculan desde SQLite y son independientes de los archivos CSV.'}),kpis([[p.total,'PQRS registradas'],[p.pqrs_corregidas,'PQRS con revisión humana'],[p.correcciones_eventos,'Cambios de riesgo registrados'],[p.patrones.palabras_distintas,'Palabras distintas en PQRS']]));
box.append(panel('Estadística descriptiva de PQRS','Desviación típica poblacional; confianza expresada en porcentaje y longitud de las solicitudes.',tablaNumerica([['Confianza (%)',p.confianza_porcentaje],['Palabras',p.longitud_palabras],['Caracteres',p.longitud_caracteres]])),e('div',{className:'two'},panel('Clasificación final del riesgo','Incluye correcciones administrativas.',barras(p.riesgo_final)),panel('Estados de las PQRS','Frecuencias absolutas.',barras(p.estados))),e('div',{className:'two'},panel('Entidades con más solicitudes','Hasta 12 entidades.',barras(p.entidades)),panel('Temas frecuentes','Hasta 12 temas.',barras(p.temas))),e('div',{className:'two'},panel('Palabras frecuentes en PQRS','Conteo de palabras tras normalizar y filtrar términos comunes.',barras(p.patrones.palabras)),panel('Frases frecuentes en PQRS','Conteo de pares de palabras normalizadas.',barras(p.patrones.frases))),e('div',{className:'two'},panel('Solicitudes por mes','Evolución de radicaciones.',barras(p.meses,24)),panel('Clasificación original del modelo','Antes de correcciones humanas.',barras(p.riesgo_original))));
box.append(e('p',{className:'hint',text:'Nota: las palabras y frases frecuentes son patrones léxicos descriptivos; no equivalen a patrones aprendidos internamente por el modelo ni a clases latentes. La moda numérica se muestra solo si algún valor se repite.'}));}
async function cargar(){const b=$('actualizar');b.disabled=true;try{const r=await fetch('/api/admin/estadisticas',{credentials:'same-origin'});if(r.status===401){location.href='/admin/login';return}if(!r.ok)throw Error('El servidor devolvió '+r.status);dibujar(await r.json())}catch(err){$('contenido').className='error';$('contenido').textContent='No se pudieron calcular las estadísticas: '+err.message}finally{b.disabled=false}}
$('actualizar').onclick=cargar;cargar();
</script></body></html>
